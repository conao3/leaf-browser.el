## test.yml

name: Main workflow
on:
  push: {branches: [master]}
  pull_request: {branches: [master]}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '31.1'
          - 'snapshot'
        include:
          - emacs_version: 'snapshot'
            allow_failure: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - name: Install keg
        run: |
          git clone --depth 1 https://github.com/conao3/keg.el "$HOME/.keg"
          echo "$HOME/.keg/bin" >> "$GITHUB_PATH"
      
      - name: Run tests
        if: matrix.allow_failure != true
        run: 'make test'
      
      - name: Run tests (allow failure)
        if: matrix.allow_failure == true
        run: 'make test || true'
